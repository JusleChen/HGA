[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hga-shadgm"
version = "0.1.0"
description = "Harmonic global assembly for EEG source imaging and source-informed motor decoding"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.15", "scikit-learn>=1.5", "joblib>=1.3"]

[project.optional-dependencies]
clinical = ["mne>=1.6", "trimesh>=4", "h5io>=0.2"]
deep = ["torch>=2.2", "einops>=0.8", "pytorch-lightning>=2.2", "torchmetrics>=1.3"]

[tool.setuptools.packages.find]
include = ["hga*", "experiments*"]

[tool.setuptools.package-data]
"hga.models.tcformer" = ["LICENSE"]
"hga.models.mirepnet" = ["LICENSE"]
